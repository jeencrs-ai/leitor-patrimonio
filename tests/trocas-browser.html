  get('formTrocaCpu').requestSubmit();get('salvarTrocaCpu').click();await wait(()=>run("trocas[1].nova.marca")==='Lenovo'&&!run('gravando'));
  assert(run('trocas.length')===2&&run('trocas[1].id')===originalSwapId,'Edit keeps ID and total');
