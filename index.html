
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Conferência Patrimonial</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<main class="app">
<section id="inicio" class="screen">
  <div class="brand"><div class="brand-icon">✓</div><div><h1>Conferência Patrimonial</h1><p>Leitura rápida de plaquetas</p></div></div>
  <div class="panel">
    <label for="setor">Setor</label>
    <input id="setor" type="text" autocomplete="off" placeholder="Digite o setor">
    <button id="btnIniciar" class="btn btn-primary btn-large">Iniciar conferência</button>
    <p id="inicioErro" class="error hidden"></p>
  </div>
</section>

<section id="conferencia" class="screen hidden">
  <header class="topbar">
    <div><span class="eyebrow">SETOR</span><h2 id="setorAtual">—</h2></div>
    <div class="counter"><strong id="total">0</strong><span>patrimônios</span></div>
  </header>
  <div id="lista" class="lista"></div>
  <div id="vazio" class="empty"><div class="empty-icon">📷</div><strong>Nenhuma plaqueta capturada</strong><span>Comece lendo a primeira plaqueta.</span></div>
  <div class="actions">
    <button id="btnCapturar" class="btn btn-primary btn-large">📷 Capturar plaqueta</button>
    <button id="btnFinalizar" class="btn btn-secondary">Finalizar conferência</button>
  </div>
</section>

<section id="leitura" class="screen hidden">
  <header class="simple-header"><button id="btnVoltarLeitura" class="icon-btn" aria-label="Voltar">←</button><div><span class="eyebrow">CAPTURA</span><h2>Leia a plaqueta</h2></div></header>
  <div class="scanner-wrap"><div id="reader"></div></div>
  <p id="statusLeitura" class="status">Aponte a câmera para o código de barras.</p>
  <button id="btnCancelarLeitura" class="btn btn-secondary">Cancelar</button>
</section>

<section id="cadastro" class="screen hidden">
  <header class="simple-header"><button id="btnCancelarCadastro" class="icon-btn" aria-label="Voltar">←</button><div><span class="eyebrow">NOVO PATRIMÔNIO</span><h2>Confirmar dados</h2></div></header>
  <div class="panel">
    <label for="plaqueta">Plaqueta <span class="required">*</span></label>
    <input id="plaqueta" type="text" readonly>
    <label for="descricao">Descrição <span class="optional">opcional</span></label>
    <input id="descricao" type="text" autocomplete="off" placeholder="Ex.: Computador Dell">
    <label for="cpf">CPF <span class="optional">opcional</span></label>
    <input id="cpf" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o CPF">
    <p id="cadastroErro" class="error hidden"></p>
    <button id="btnSalvar" class="btn btn-primary btn-large">Salvar patrimônio</button>
  </div>
</section>

<section id="finalizacao" class="screen hidden">
  <div class="success-icon">✓</div><h1>Conferência finalizada</h1>
  <p id="resumoFinal" class="final-summary"></p>
  <div class="panel summary-panel"><div><span>Setor</span><strong id="finalSetor">—</strong></div><div><span>Patrimônios</span><strong id="finalTotal">0</strong></div></div>
  <button id="btnCompartilhar" class="btn btn-primary btn-large">📤 Compartilhar arquivo</button>
  <button id="btnNova" class="btn btn-danger">Nova conferência</button>
  <button id="btnManter" class="btn btn-secondary">Manter esta conferência</button>
  <p id="shareStatus" class="status"></p>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
