<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monitores por setor</title><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/html5-qrcode"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script></head>
<body><main class="app fluxo-troca"><h1>Monitores por setor</h1>
<section id="inicioSetor"><form id="formSetor"><div class="campo"><label for="setor">Nome do setor / departamento</label><input id="setor" required list="setores" autocomplete="off"><datalist id="setores"></datalist></div><button class="botao botao-principal">ABRIR SETOR</button></form><button id="verResumo" class="botao botao-secundario">VER RESUMO POR SETOR</button><h2>Setores salvos</h2><div id="listaSetores" class="lista"></div></section>
<section id="leitura" class="oculto"><button id="voltarSetores" class="texto-botao">← SETORES</button><h2 id="nomeSetor"></h2><details><summary>Gerenciar setor</summary><div class="campo"><label for="editarNome">Nome do setor</label><input id="editarNome"></div><button id="renomear" class="texto-botao">SALVAR NOME</button><button id="excluirSetor" class="texto-botao">EXCLUIR SETOR</button></details><div class="acoes"><button id="abrirEntrada" class="botao botao-principal">ENTRADA → NOVO</button><button id="abrirSaida" class="botao botao-secundario">SAÍDA → VELHO</button><button id="abrirSubstituicao" class="botao botao-secundario">SUBSTITUIÇÃO</button></div><p id="contador"></p><button id="finalizar" class="botao botao-secundario">VER RESUMO</button><details><summary>Histórico de monitores</summary><div id="registros" class="lista"></div></details></section>
<section id="telaMovimento" class="oculto"><button id="voltarMovimento" class="texto-botao" type="button">← VOLTAR AO SETOR</button><p id="setorMovimento" class="rotulo"></p><h2 id="tituloMovimento"></h2><form id="formulario"><input id="movimento" type="hidden" value="saida"><div id="campoDestino" class="campo oculto"><label for="destino">Setor de destino</label><input id="destino" list="setores" autocomplete="off"></div><button id="ler" type="button" class="botao botao-principal">LER MONITOR COM A CÂMERA</button><div id="camera" class="oculto"><div id="reader"></div><button id="parar" type="button">FECHAR CÂMERA</button></div><div class="campo"><label for="patrimonio">Patrimônio do monitor</label><input id="patrimonio" readonly placeholder="Use a câmera para ler"></div><div class="campo"><label for="marca">Marca do monitor</label><input id="marca" required autocomplete="off" placeholder="Ex.: Dell, LG, Samsung"></div><textarea id="observacao" class="oculto" hidden></textarea><button id="salvar" class="botao botao-principal">SALVAR</button><button id="cancelarEdicao" type="button" class="texto-botao oculto">CANCELAR EDIÇÃO</button></form></section>
<section id="resumo" class="oculto"><h2>Resumo por setor</h2><p id="total"></p><div id="resumoSetores" class="lista"></div><button id="exportar" class="botao botao-principal">EXPORTAR PARA EXCEL</button><button id="whatsapp" class="botao botao-secundario">ENVIAR RESUMO PELO WHATSAPP</button><button id="continuar" class="botao botao-secundario">VOLTAR AOS SETORES</button></section>
<p id="status" class="status" role="status" aria-live="polite"></p></main><script src="leitura.js?v=20261020-3"></script></body></html>
